<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(15, 12)">
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#0F172A" stroke="url(#grad1)" stroke-width="2.5"/>
    <!-- Neural / AI Hexagon & Brain Nodes -->
    <path d="M38 18 L60 30 L60 56 L38 68 L16 56 L16 30 Z" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    <circle cx="38" cy="30" r="4" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="26" cy="50" r="3.5" fill="#6366F1"/>
    <circle cx="50" cy="50" r="3.5" fill="#10B981"/>
    <circle cx="38" cy="46" r="6" fill="url(#grad1)"/>
    <line x1="38" y1="30" x2="38" y2="46" stroke="#38BDF8" stroke-width="2"/>
    <line x1="26" y1="50" x2="38" y2="46" stroke="#6366F1" stroke-width="2"/>
    <line x1="50" y1="50" x2="38" y2="46" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="105" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5px">
    Talent<tspan fill="url(#grad1)">Pulse</tspan><tspan fill="#38BDF8" font-size="22">.ai</tspan>
  </text>
  <text x="106" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="2.2px">
    AI INTERVIEW &amp; SKILL GAP ENGINE
  </text>
</svg>
