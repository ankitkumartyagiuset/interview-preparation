<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TalentPulse AI</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="auth-page dark-theme">
    <div class="auth-wrapper">
        <div class="auth-card glass-card fade-in">
            <div class="auth-logo-area">
                <img src="/static/img/logo.svg" alt="TalentPulse Logo" class="auth-logo">
                <h1>Talent<span>Pulse</span> AI</h1>
                <p>AI-Powered Resume Mock Interview & Skill Gap Analyzer</p>
            </div>
            
            <div class="auth-body">
                <div class="alert-container" id="alertContainer"></div>
                <form id="loginForm" onsubmit="submitLogin(event)">
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" required placeholder="name@company.com" autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-pulse">
                        Sign In <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="/register">Create an Account</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        async function submitLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const alertContainer = document.getElementById("alertContainer");
            
            alertContainer.innerHTML = '';
            
            try {
                const response = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || "Authentication failed. Check your credentials.");
                }
                
                // Redirect on success
                window.location.href = "/dashboard";
            } catch (err) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger animate-shake">
                        <i class="fa-solid fa-circle-exclamation"></i> ${err.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
