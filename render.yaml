services:
  - type: web
    name: interview-platform-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: interview-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: interview-platform-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production

  - type: redis
    name: interview-platform-redis
    plan: free
    ipAllowList: []

databases:
  - name: interview-platform-db
    plan: free