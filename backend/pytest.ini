[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    asyncio: mark test as async
    integration: mark test as integration test
    slow: mark test as slow running

[coverage:run]
source = app
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
